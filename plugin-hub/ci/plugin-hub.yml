# CMPLXTY Plugin Hub (installs/updates the VST3+CLAP plug-ins from their GitHub releases) - CI for github.com/cmplxtymusic/cmplxty-plugins (project lives in the plugin-hub/ folder).
# GitHub only reads workflows from the repository root: this file belongs at .github/workflows/plugin-hub.yml
# (a copy is kept at plugin-hub/ci/plugin-hub.yml).
# STATUS: not yet run on GitHub. The Windows job mirrors the local, tested box build;
# the macOS job has never run on a Mac. Installers are UNSIGNED (Windows SmartScreen / macOS Gatekeeper will warn).
name: plugin-hub
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['plugin-hub-v*']
    paths: ['plugin-hub/**', '.github/workflows/plugin-hub.yml']
  pull_request:
    paths: ['plugin-hub/**', '.github/workflows/plugin-hub.yml']
defaults:
  run:
    shell: bash
    working-directory: plugin-hub
env:
  LLVM_VERSION: '23.1.4'
  XWIN_VERSION: '0.10.0'
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxcomposite-dev libxext-dev libgl1-mesa-dev 7zip curl
      - run: ./scripts/fetch-deps.sh
      - name: Build hub + test
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF
          cmake --build build/linux --target PluginHub PluginHubTest --parallel
      - name: Hub tests (live release list, real installers unpacked into a temp prefix, presets + untouched plug-ins checked)
        env: { HUB_7Z: 7zz }
        run: build/linux/PluginHubTest_artefacts/Release/PluginHubTest both "$RUNNER_TEMP/hub-test"

  windows:
    # cross-compiled on Linux with clang-cl + xwin (static /MT CRT, no Visual C++ redistributable needed), packed with NSIS
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools (NSIS, ninja, host compiler for juceaide)
        run: sudo apt-get update && sudo apt-get install -y nsis ninja-build g++ libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev
      - uses: actions/cache@v4
        id: toolcache
        with:
          path: |
            ~/.local/llvm
            ~/.local/xwin-sdk
          key: llvm-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}
      - name: LLVM + Windows SDK/CRT (xwin; accepting the Microsoft licence)
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/llvm ~/.local/bin /tmp/dl && cd /tmp/dl
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz -C ~/.local/llvm --strip-components=1
          curl -fsSL -o xwin.tar.gz "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf xwin.tar.gz --strip-components=1 -C ~/.local/bin
          ~/.local/bin/xwin --accept-license --arch x86_64 --variant desktop splat --output ~/.local/xwin-sdk
      - run: ./scripts/fetch-deps.sh
      - run: ./scripts/build-windows-xwin.sh
      - run: ./scripts/build-installer.sh
      - name: Checksum
        run: cd dist && sha256sum CMPLXTY-Plugin-Hub-Setup-*-win.exe | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hub-windows-installer
          path: |
            plugin-hub/dist/CMPLXTY-Plugin-Hub-Setup-*-win.exe
            plugin-hub/dist/SHA256SUMS

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja
      - run: ./scripts/fetch-deps.sh
      - name: Universal app -> .pkg
        run: ./scripts/build-macos-pkg.sh
      - name: Checksum
        run: cd dist && shasum -a 256 CMPLXTY-Plugin-Hub-Setup-*-mac.pkg | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hub-macos-installer
          path: |
            plugin-hub/dist/CMPLXTY-Plugin-Hub-Setup-*-mac.pkg
            plugin-hub/dist/SHA256SUMS

  release:
    # only on a version tag; every asset is built by the jobs above on GitHub-hosted runners, never on a dev machine
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-hub-v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plugin-hub-windows-installer, path: win }
      - uses: actions/download-artifact@v4
        with: { name: plugin-hub-macos-installer, path: mac }
      - name: Combined SHA256SUMS
        run: |
          mkdir rel && cp win/*.exe mac/*.pkg rel/
          cd rel && sha256sum * | tee SHA256SUMS
      - name: GitHub release (draft; publish by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" rel/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" \
            --notes "Built by GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
