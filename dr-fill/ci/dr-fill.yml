# CMPLXTY Dr Fill (drum loops -> drum fill) - CI for github.com/cmplxtymusic/cmplxty-plugins (project lives in the dr-fill/ folder).
# GitHub only reads workflows from the repository root: this file belongs at .github/workflows/dr-fill.yml
# (a copy is kept at dr-fill/ci/dr-fill.yml).
# STATUS: not yet run on GitHub. The Windows job mirrors the local, tested box build;
# the macOS job has never run on a Mac. Installers are UNSIGNED (Windows SmartScreen / macOS Gatekeeper will warn).
name: dr-fill
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['dr-fill-v*']
    paths: ['dr-fill/**', '.github/workflows/dr-fill.yml']
  pull_request:
    paths: ['dr-fill/**', '.github/workflows/dr-fill.yml']
defaults:
  run:
    shell: bash
    working-directory: dr-fill
env:
  LLVM_VERSION: '23.1.4'
  XWIN_VERSION: '0.10.0'
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxcomposite-dev libxext-dev libgl1-mesa-dev
      - run: ./scripts/fetch-deps.sh
      - name: Build VST3 + CLAP + Standalone
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF -DCLAP_JUCE_EXTENSIONS_BUILD_EXAMPLES=OFF
          cmake --build build/linux --target DrFill_VST3 DrFill_CLAP DrFill_Standalone DrFillUpdateTest DrFillDspTest --parallel
      - name: DSP + update-logic tests
        run: |
          build/linux/DrFillDspTest
          build/linux/DrFillUpdateTest_artefacts/Release/DrFillUpdateTest
      - name: Package
        run: |
          mkdir -p ../out/linux
          cp -r build/linux/DrFill_artefacts/Release/VST3 build/linux/DrFill_artefacts/Release/CLAP build/linux/DrFill_artefacts/Release/Standalone ../out/linux/
          mkdir -p ../out/moduleinfo
          cp "build/linux/DrFill_artefacts/Release/VST3/CMPLXTY Dr Fill.vst3/Contents/Resources/moduleinfo.json" ../out/moduleinfo/
      - uses: actions/upload-artifact@v4
        with: { name: dr-fill-linux, path: out/linux }
      - uses: actions/upload-artifact@v4
        with: { name: dr-fill-moduleinfo, path: out/moduleinfo }

  windows:
    # cross-compiled on Linux with clang-cl + xwin (static /MT CRT, no Visual C++ redistributable needed), packed with NSIS
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dr-fill-moduleinfo, path: dr-fill/build/linux/DrFill_artefacts/Release/VST3/CMPLXTY Dr Fill.vst3/Contents/Resources }
      - name: Tools (NSIS, ninja, host compiler for juceaide)
        run: sudo apt-get update && sudo apt-get install -y nsis ninja-build g++ libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev
      - uses: actions/cache@v4
        id: toolcache
        with:
          path: |
            ~/.local/llvm
            ~/.local/xwin-sdk
          key: llvm-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}
      - name: LLVM + Windows SDK/CRT (xwin; accepting the Microsoft licence)
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/llvm ~/.local/bin /tmp/dl && cd /tmp/dl
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz -C ~/.local/llvm --strip-components=1
          curl -fsSL -o xwin.tar.gz "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf xwin.tar.gz --strip-components=1 -C ~/.local/bin
          ~/.local/bin/xwin --accept-license --arch x86_64 --variant desktop splat --output ~/.local/xwin-sdk
      - run: ./scripts/fetch-deps.sh
      - run: ./scripts/build-windows-xwin.sh
      - run: ./scripts/build-installer.sh
      - name: Check ProductName / ProductVersion metadata (SignPath)
        run: |
          pip install --quiet pefile
          S=dist/stage-windows-x64
          python3 ../tools/check-win-metadata.py . "$S/CMPLXTY Dr Fill.vst3/Contents/x86_64-win/CMPLXTY Dr Fill.vst3" "$S/CMPLXTY Dr Fill.clap" "$S/CMPLXTY Dr Fill.exe" dist/*-win.exe
      - name: Checksum
        run: cd dist && sha256sum CMPLXTY-Dr-Fill-Setup-*-win.exe | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dr-fill-windows-installer
          path: |
            dr-fill/dist/CMPLXTY-Dr-Fill-Setup-*-win.exe
            dr-fill/dist/SHA256SUMS

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja
      - run: ./scripts/fetch-deps.sh
      - name: Universal VST3 + CLAP + app -> .pkg
        run: ./scripts/build-macos-pkg.sh
      - name: Checksum
        run: cd dist && shasum -a 256 CMPLXTY-Dr-Fill-Setup-*-mac.pkg | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dr-fill-macos-installer
          path: |
            dr-fill/dist/CMPLXTY-Dr-Fill-Setup-*-mac.pkg
            dr-fill/dist/SHA256SUMS

  release:
    # only on a version tag; every asset is built by the jobs above on GitHub-hosted runners, never on a dev machine
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dr-fill-v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dr-fill-windows-installer, path: win }
      - uses: actions/download-artifact@v4
        with: { name: dr-fill-macos-installer, path: mac }
      - name: Combined SHA256SUMS
        run: |
          mkdir rel && cp win/*.exe mac/*.pkg rel/
          cd rel && sha256sum * | tee SHA256SUMS
      - name: GitHub release (draft; publish by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" rel/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" \
            --notes "Built by GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
