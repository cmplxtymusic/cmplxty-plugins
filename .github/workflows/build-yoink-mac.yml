# Builds the macOS Yoink.dmg (universal: Apple Silicon + Intel), prints its SHA256 and uploads it as a downloadable artifact.
# Run it by hand: GitHub > Actions > "Build Yoink for Mac" > Run workflow. Free for public repos; private repos use free-plan minutes (macOS minutes count 10x).
# Yoink lives in the yoink/ folder of this repo.
# No Apple account is needed. Without the optional secrets below the app is ad-hoc signed (Gatekeeper shows a warning on first open).
# Optional secrets (only if an Apple Developer ID is ever bought): CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
name: Build Yoink for Mac

on:
  workflow_dispatch:
  push:
    tags: ['yoink-mac-v*', 'yoink-v*']

jobs:
  build:
    # The Mac disk image stays on yoink-mac-v* tags. yoink-v* is the Windows installer only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'yoink-mac-v')
    runs-on: macos-latest   # Apple Silicon runner; the Intel half is cross-compiled
    timeout-minutes: 60
    defaults:
      run:
        working-directory: yoink
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yoink/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Fetch yt-dlp and build ffmpeg (audio-only, LGPL)
        run: bash build-mac.sh tools
      - name: Stage the Clean up engine (onnxruntime) for both CPUs
        run: bash build-mac.sh stage
      - name: Run the tests
        run: |
          npm test
          npm run test:mac
      - name: Build the .dmg
        run: bash build-mac.sh dmg
      - name: Check the result
        run: |
          set -e
          lipo -info dist-mac/mac-universal/Yoink.app/Contents/MacOS/Yoink
          lipo -info dist-mac/mac-universal/Yoink.app/Contents/Resources/bin/ffmpeg
          lipo -info dist-mac/mac-universal/Yoink.app/Contents/Resources/bin/yt-dlp
          codesign --verify --deep --strict --verbose=2 dist-mac/mac-universal/Yoink.app || echo "(codesign verify reported a problem: see above)"
          codesign -dv dist-mac/mac-universal/Yoink.app 2>&1 | head -8 || true
          ls -la dist-mac/Yoink.dmg
          echo "SHA256:"; cat dist-mac/Yoink.dmg.sha256
      - name: Put the SHA256 in the run summary
        run: |
          { echo "### Yoink.dmg"; echo; echo '```'; cat dist-mac/Yoink.dmg.sha256; echo '```'; ls -l dist-mac/Yoink.dmg | awk '{print "size: " $5 " bytes"}'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Yoink-mac-dmg
          path: |
            yoink/dist-mac/Yoink.dmg
            yoink/dist-mac/Yoink.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  ffmpeg:
    # Minimal LGPL ffmpeg.exe from yoink/build-ffmpeg-min.sh (the binary build-win.sh expects).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'yoink-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: yoink
    steps:
      - uses: actions/checkout@v4
      - name: MinGW, nasm, make
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 nasm make pkg-config
      - name: Build ffmpeg.exe
        env:
          W: ${{ runner.temp }}/ffbuild
        run: |
          mkdir -p build/tools
          bash "$GITHUB_WORKSPACE/yoink/build-ffmpeg-min.sh"
          cp "$W/ffmpeg-7.1.1/COPYING.LGPLv2.1" build/tools/ffmpeg-LICENSE.txt
          test -s build/tools/ffmpeg.exe
      - uses: actions/upload-artifact@v4
        with:
          name: yoink-ffmpeg-exe
          path: |
            yoink/build/tools/ffmpeg.exe
            yoink/build/tools/ffmpeg-LICENSE.txt

  windows:
    # NSIS installer from electron-builder, same as yoink/build-win.sh. Runs on Windows so the
    # uninstaller stub does not need Wine. onnxruntime-node is the Windows binary npm installs here.
    needs: ffmpeg
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'yoink-v')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: yoink
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yoink/package-lock.json
      - uses: actions/download-artifact@v4
        with: { name: yoink-ffmpeg-exe, path: yoink/build/tools }
      - name: Install packages
        run: npm ci
      - name: yt-dlp and the Electron Windows binary
        run: |
          curl -fsSL -o build/tools/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          mkdir -p build/electron-dist
          curl -fsSL -o /tmp/electron.zip "https://github.com/electron/electron/releases/download/v45.0.0/electron-v45.0.0-win32-x64.zip"
          unzip -q /tmp/electron.zip -d build/electron-dist
          test -s build/tools/ffmpeg.exe
          test -s build/electron-dist/electron.exe
      - name: Stage ONNX Runtime, test, build Yoink-Setup.exe
        run: |
          node build/stage-ort.js
          npm test
          npx electron-builder --win nsis --x64
      - name: Checksum
        run: |
          node -e "const c=require('crypto'),f=require('fs'); const b=f.readFileSync('dist/Yoink-Setup.exe'); console.log(c.createHash('sha256').update(b).digest('hex')+'  Yoink-Setup.exe')" | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Yoink-windows-installer
          path: |
            yoink/dist/Yoink-Setup.exe
            yoink/dist/SHA256SUMS
          if-no-files-found: error
