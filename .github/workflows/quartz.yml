# Quartz CI. macOS: universal VST3 .pkg. Windows: llvm-mingw VST3, NSIS setup exe, and a VST3 zip.
# Quartz has no CLAP target. Unsigned (no Apple Developer ID / no Windows signing).
name: quartz
on:
  workflow_dispatch:
  push:
    tags: ['quartz-v*']
defaults:
  run:
    shell: bash
    working-directory: quartz
jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ nsis zip git pkg-config libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxcomposite-dev libxext-dev
      - name: llvm-mingw (ucrt)
        run: |
          mkdir -p "$HOME/.local" /tmp/dl && cd /tmp/dl
          curl -fsSL -o mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar -xf mingw.tar.xz -C "$HOME/.local"
          echo "LLVM_MINGW_ROOT=$HOME/.local/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
      - name: Windows VST3 -> setup exe + zip
        run: ./scripts/build-windows-mingw.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quartz-windows
          path: |
            quartz/dist/Quartz-Setup-*.exe
            quartz/dist/Quartz-*-VST3.zip
            quartz/dist/SHA256SUMS
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja || true
      - name: Universal VST3 -> .pkg (+ update-check test)
        run: ./scripts/build-macos-pkg.sh
      - name: Checksum
        run: cd dist && shasum -a 256 CMPLXTY-Quartz-Setup-*-mac.pkg | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quartz-macos-installer
          path: |
            quartz/dist/CMPLXTY-Quartz-Setup-*-mac.pkg
            quartz/dist/SHA256SUMS
