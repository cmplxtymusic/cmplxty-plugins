# CMPLXTY Visualizer - CI for github.com/cmplxtymusic/cmplxty-plugins (project lives in the visualizer/ folder).
# GitHub only reads workflows from the repository root: this file belongs at .github/workflows/visualizer.yml
# (a copy is kept at visualizer/ci/visualizer.yml).
# STATUS: written but never run on GitHub by the author. The Windows job mirrors the local, tested box build;
# the macOS job has never run on a Mac. Installers are UNSIGNED (Windows SmartScreen / macOS Gatekeeper will warn).
name: visualizer
on:
  workflow_dispatch:
  push:
    tags: ['visualizer-v*']
    paths: ['visualizer/**', '.github/workflows/visualizer.yml']
  pull_request:
    paths: ['visualizer/**', '.github/workflows/visualizer.yml']
defaults:
  run:
    shell: bash
    working-directory: visualizer
env:
  LLVM_VERSION: '23.1.4'
  XWIN_VERSION: '0.10.0'
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxcomposite-dev libxext-dev libgl1-mesa-dev xvfb xfwm4
      - run: ./scripts/fetch-deps.sh
      - name: Build VST3 + CLAP + Standalone + tests
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF -DCLAP_JUCE_EXTENSIONS_BUILD_EXAMPLES=OFF
          cmake --build build/linux --target Visualizer_VST3 Visualizer_CLAP Visualizer_Standalone VisualizerAnalysisTest VisualizerUpdateTest VisualizerScreenshot --parallel
      - name: Analysis + update-logic tests
        run: |
          build/linux/VisualizerAnalysisTest
          build/linux/VisualizerUpdateTest_artefacts/Release/VisualizerUpdateTest
      - name: Presets, processor, parameters and keyboard tests (Xvfb; the keys test needs a window manager)
        run: |
          T=$PWD/build/linux/VisualizerScreenshot_artefacts/Release/VisualizerScreenshot
          export HOME=$RUNNER_TEMP/vzhome && mkdir -p "$HOME"
          xvfb-run -a "$T" - presets
          xvfb-run -a "$T" - proc
          xvfb-run -a "$T" - params
          xvfb-run -a sh -c "xfwm4 --compositor=off >/dev/null 2>&1 & sleep 2; '$T' - keys"
      - name: Package
        run: |
          mkdir -p ../out/linux
          cp -r build/linux/Visualizer_artefacts/Release/VST3 build/linux/Visualizer_artefacts/Release/CLAP build/linux/Visualizer_artefacts/Release/Standalone ../out/linux/
          mkdir -p ../out/moduleinfo
          cp "build/linux/Visualizer_artefacts/Release/VST3/CMPLXTY Visualizer.vst3/Contents/Resources/moduleinfo.json" ../out/moduleinfo/
      - uses: actions/upload-artifact@v4
        with: { name: visualizer-linux, path: out/linux }
      - uses: actions/upload-artifact@v4
        with: { name: moduleinfo, path: out/moduleinfo }

  windows:
    # cross-compiled on Linux with clang-cl + xwin (static /MT CRT, no Visual C++ redistributable needed), packed with NSIS
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: moduleinfo, path: visualizer/build/linux/Visualizer_artefacts/Release/VST3/CMPLXTY Visualizer.vst3/Contents/Resources }
      - name: Tools (NSIS, ninja, host compiler for juceaide)
        run: sudo apt-get update && sudo apt-get install -y nsis ninja-build g++ libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev
      - uses: actions/cache@v4
        id: toolcache
        with:
          path: |
            ~/.local/llvm
            ~/.local/xwin-sdk
          key: llvm-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}
      - name: LLVM + Windows SDK/CRT (xwin; accepting the Microsoft licence)
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/llvm ~/.local/bin /tmp/dl && cd /tmp/dl
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz -C ~/.local/llvm --strip-components=1
          curl -fsSL -o xwin.tar.gz "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf xwin.tar.gz --strip-components=1 -C ~/.local/bin
          ~/.local/bin/xwin --accept-license --arch x86_64 --variant desktop splat --output ~/.local/xwin-sdk
      - run: ./scripts/fetch-deps.sh
      - run: ./scripts/build-windows-xwin.sh
      - run: ./scripts/build-installer.sh
      - name: Checksum
        run: cd dist && sha256sum CMPLXTY-Visualizer-Setup-*-win.exe | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: visualizer-windows-installer
          path: |
            visualizer/dist/CMPLXTY-Visualizer-Setup-*-win.exe
            visualizer/dist/SHA256SUMS

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja
      - run: ./scripts/fetch-deps.sh
      - name: Universal VST3 + CLAP + Standalone app -> .pkg
        run: ./scripts/build-macos-pkg.sh
      - name: Checksum
        run: cd dist && shasum -a 256 CMPLXTY-Visualizer-Setup-*-mac.pkg | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: visualizer-macos-installer
          path: |
            visualizer/dist/CMPLXTY-Visualizer-Setup-*-mac.pkg
            visualizer/dist/SHA256SUMS
